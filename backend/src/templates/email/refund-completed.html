<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background:#1a1a2e;padding:24px 28px;color:#ffffff;">
              <div style="font-size:20px;font-weight:bold;">Deer</div>
              <div style="font-size:13px;color:#c9c9dd;margin-top:4px;">Refund completed</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#333;">Hi {{name}},</p>
              <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#444;">
                Your refund of <strong style="color:#1a1a2e;">₹{{refundAmount}}</strong> for order
                <strong style="color:#1a1a2e;">#{{orderNumber}}</strong> has been completed.
              </p>
              <p style="margin:0 0 0;font-size:13px;line-height:1.6;color:#666;">
                If you do not see the refund in your account within a few days, please contact your payment provider.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background:#fafafa;padding:16px 28px;font-size:11px;color:#999;">
              © Deer Clothing. All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
