<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background:#7a1f1f;padding:24px 28px;color:#ffffff;">
              <div style="font-size:20px;font-weight:bold;">Deer</div>
              <div style="font-size:13px;color:#e3c9c9;margin-top:4px;">Order cancelled</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#333;">Hi {{name}},</p>
              <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#444;">
                Your order <strong style="color:#1a1a2e;">#{{orderNumber}}</strong> has been cancelled.
              </p>
              {{#reason}}<p style="margin:0 0 20px;font-size:13px;line-height:1.6;color:#777;">Reason: {{reason}}</p>{{/reason}}
              {{#refundInfo}}<p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#444;">
                {{refundInfo}}
              </p>{{/refundInfo}}
              <p style="margin:0 0 0;font-size:12px;line-height:1.6;color:#888;">
                If this was unexpected, please contact our support team.
              </p>
            </td>
          </tr>
          <tr>
            <td style="background:#fafafa;padding:16px 28px;font-size:11px;color:#999;">
              © Deer Clothing. All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
